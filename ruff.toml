# Ruff config for ReplyDesk. Verified clean with `ruff check .` on every file
# in the repo (package, tests, scripts, notebooks, CI helpers).
target-version = "py310"   # matches the CI matrix floor (Python 3.10)
line-length = 100
extend-exclude = [
  ".venv",
  "__pycache__",
  ".ruff_cache",
  ".pytest_cache",
]

[lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "C4",            # comprehensions
  "SIM",           # simplify
]
ignore = [
  "E501",  # line length handled by formatter; long prompts are fine
]

[lint.per-file-ignores]
"tests/*" = ["E402"]              # tests import after sys.path manipulation
"notebooks/*" = ["E402"]          # .ipynb cells run top-to-bottom; imports
                                  # after env setup inside a cell are fine
"replydesk/chains.py" = ["E501"]  # prompt strings are intentionally long