[pytest]
testpaths = tests
asyncio_mode = auto

# pytest-asyncio >= 1.0 moved the event-loop fixtures to a new scope model;
# without this key, suite-level async fixtures (tests/conftest.py) raise
# "async def functions are not natively supported" / scope errors.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:pydantic.*